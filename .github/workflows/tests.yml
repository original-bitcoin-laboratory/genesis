# Run the full reproduction pipeline (Python suites + Rust cargo test) on every push/PR. NOT money.
# The crypto-conformance suite skips gracefully when libsecp256k1/bitcoinx is absent, so the faithful
# `cryptography` path is all that's required here.
#
# Note: we do not add a `git diff` artifact-drift gate. The regenerated descendant matrix records
# *execution capability* per descendant (BTC/BSV "executed" via optional local tooling), which is an
# environment-dependent fact rather than non-determinism, so a drift gate is environment-coupled and is
# checked in the maintainer's environment instead. Here the gate is that every suite passes.
name: tests

on:
  push:
    branches: [main]
    paths:
      - "derivatives/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install --quiet cryptography pytest

      - name: Verify genesis re-derives from source
        run: python scripts/verify_genesis.py

      - name: Reproduce the whole lab (Python suites + Rust cargo test)
        run: python scripts/reproduce.py --rust

  # A focused, required gate: re-run only the checks behind the reconstruction's four findings, under
  # the faithful profiles, cross-implemented in Rust. Fails hard if a requested backend is unavailable.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: pip install --quiet cryptography pytest
      - name: Reproduce the four findings (faithful profiles, Rust cross-check)
        run: python scripts/reproduce_claims.py --rust
