# Run the full reproduction pipeline (Python suites + Rust cargo test) on every push/PR. NOT money.
# The crypto-conformance suite skips gracefully when libsecp256k1/bitcoinx is absent, so the faithful
# `cryptography` path is all that's required here.
#
# Note: we do not add a `git diff` artifact-drift gate. The regenerated descendant matrix records
# *execution capability* per descendant (BTC/BSV "executed" via optional local tooling), which is an
# environment-dependent fact rather than non-determinism, so a drift gate is environment-coupled and is
# checked in the maintainer's environment instead. Here the gate is that every suite passes.
name: tests

on:
  push:
    branches: [main]
    paths:
      - "derivatives/**"
      - "scripts/**"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install --quiet cryptography pytest

      - name: Verify genesis re-derives from source
        run: python scripts/verify_genesis.py

      - name: Reproduce the whole lab (Python suites + Rust cargo test)
        run: python scripts/reproduce.py --rust

  # A focused, required gate: re-run only the checks behind the reconstruction's findings, under the
  # faithful profiles, cross-implemented in BOTH Rust and the C++/OpenSSL port. Fails hard if a requested
  # backend is unavailable — and the cross-implementation claim (C1b) is only "complete" when both run.
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies (Python + OpenSSL headers for the C++/OpenSSL port)
        run: |
          pip install --quiet cryptography pytest
          sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
      - name: Reproduce the findings (faithful profiles, Rust + C++/OpenSSL cross-check)
        run: python scripts/reproduce_claims.py --rust --cpp

  # The same claim gate on Windows/MSYS2 — the exact environment of the frozen supplement manifest, so
  # the C++/OpenSSL port's evidence is CI-exercised on its native toolchain, not only on Linux.
  claims-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: "msys2 {0}"
    steps:
      - uses: actions/checkout@v4
      # Install every dependency via pacman (the MSYS2-native path). `pip install cryptography`
      # is NOT usable here: MINGW64 CPython has no prebuilt cryptography wheel, so pip falls back
      # to a from-source build (maturin/Rust) that fails — and MSYS2's Python is PEP 668
      # externally-managed anyway. The pacman `python-cryptography`/`python-pytest` packages are
      # prebuilt against this exact MINGW64 toolchain, which is the whole point of the job.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # git + diffutils are MSYS base packages the reproduction needs inside the msys2 shell:
          # reproduce_claims.py shells out to `git rev-parse HEAD`, and the C++/OpenSSL port
          # harnesses (run.sh / run_sighash.sh) diff their output against golden vectors. The
          # native Windows git is not on the msys2 PATH, so it must be installed here.
          install: >-
            git diffutils
            mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-cryptography mingw-w64-x86_64-python-pytest
            mingw-w64-x86_64-rust
      - name: Reproduce the findings on Windows/MSYS2 (Rust + C++/OpenSSL)
        run: python scripts/reproduce_claims.py --rust --cpp
