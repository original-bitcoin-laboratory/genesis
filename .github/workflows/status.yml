# Probe the public anchors over their own P2P protocol and publish status.json for the status page +
# block explorer. No box access, no secrets beyond the built-in token. NOT money.
name: status

on:
  schedule:
    - cron: "*/15 * * * *"      # every 15 minutes (best-effort; GitHub may delay/skip under load)
  workflow_dispatch:

permissions:
  contents: write
  issues: write          # the height watch opens one issue when the retarget height is reached

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet cryptography

      - name: Probe anchors -> status.json
        run: |
          python derivatives/netnode/status_probe.py --out /tmp/status.json \
            --chain jan09x:18009 --chain nov08x:18008 \
            --chain bitcoin:18026@bitcoin.bitcoin-lab.org \
            --anchor-host seed.bitcoin-lab.org \
            --recent 15 --timeout 8

      - name: Height watch (Bitcoin (2026) against the first retarget, 2016)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python scripts/height_watch.py --status /tmp/status.json
          rc=$?
          set -e
          if [ "$rc" = 2 ]; then
            title="Bitcoin (2026) reached height 2016: seal the retarget findings set"
            if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title"                 --body "The scheduled status probe read the chain at or past height 2016. WHY-THE-CHAIN-CONTINUES.md states what this height is for; CONSENSUS_BEHAVIORS.md states the expected retarget result at difficulty 1. Seal the findings set (raw block bytes, the measured interval series across the window) at the standard of the other sets, within days. Opened by the status workflow; not money."
            fi
          fi

      - name: Publish to the 'status' branch
        run: |
          git config user.name "obl-status-bot"
          git config user.email "status@users.noreply.github.com"
          git checkout --orphan status
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/status.json status.json
          git add status.json
          git commit -m "status $(date -u +%FT%TZ)"
          git push -f origin status
