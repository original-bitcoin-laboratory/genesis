# Decentralized preservation — request archival of the Original Bitcoin Laboratory repositories on
# independent, content-addressed infrastructure, so the reproducible source of truth survives even if the
# primary host does not. The reconstruction re-derives from source with no live node; this keeps that
# source retrievable and self-verifying from more than one root. NOT money.
name: preserve

on:
  schedule:
    - cron: '17 4 * * *'          # daily. Software Heritage "save now" is rate-limited, so not hourly.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Software Heritage — the universal source-code archive. No credentials needed; runs on every trigger.
  software-heritage:
    runs-on: ubuntu-latest
    steps:
      - name: Request archival of every OBL repository
        run: |
          for repo in genesis pre-genesis common .github; do
            url="https://github.com/original-bitcoin-laboratory/$repo"
            echo "== $url =="
            resp=$(curl -sS -X POST -H "Accept: application/json" \
              "https://archive.softwareheritage.org/api/1/origin/save/git/url/$url/" || echo '{"error":"request failed"}')
            echo "  ${resp:0:300}"
            sleep 6
          done

  # 2) Radicle — a peer-to-peer git mirror, so the repo has no single hosting dependency.
  #    Enable by adding a RAD_KEYPAIR secret (one-time setup in docs/PRESERVATION.md).
  #    For hourly mirroring once configured, add:  - cron: '0 * * * *'  above.
  radicle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Mirror to Radicle (if configured)
        env:
          RAD_KEYPAIR: ${{ secrets.RAD_KEYPAIR }}
          RAD_PASSPHRASE: ${{ secrets.RAD_PASSPHRASE }}
          RID: rad:z4ZYBKCfJFomHvbS8d8oKzfgbR6Hg
        run: |
          set -euo pipefail
          if [ -z "$RAD_KEYPAIR" ]; then
            echo "::warning title=Radicle mirror not configured::RAD_KEYPAIR is not set, so nothing was mirrored to Radicle. This job is green because skipping is not an error - which is exactly how a dormant mirror comes to look like a working one. docs/PRESERVATION.md records Radicle as published but NOT continuously mirrored; keep that accurate, or set the secret."
            echo "RAD_KEYPAIR not set - Radicle mirror skipped. See docs/PRESERVATION.md to enable."
            exit 0
          fi

          curl -sSfL https://radicle.xyz/install | sh -s -- --no-modify-path
          export PATH="$HOME/.radicle/bin:$PATH"
          rad --version   # 1.9.1 at time of writing

          # RAD_KEYPAIR is the OPENSSH private key, base64-encoded so it survives as one secret line.
          mkdir -p "$HOME/.radicle/keys"
          printf '%s' "$RAD_KEYPAIR" | base64 -d > "$HOME/.radicle/keys/radicle"
          chmod 600 "$HOME/.radicle/keys/radicle"
          ssh-keygen -y -P "${RAD_PASSPHRASE:-}" -f "$HOME/.radicle/keys/radicle" > "$HOME/.radicle/keys/radicle.pub"

          export RAD_PASSPHRASE="${RAD_PASSPHRASE:-}"
          rad auth --stdin <<< "$RAD_PASSPHRASE" || rad auth
          rad node start   # backgrounds by default; --daemon is not a flag, --foreground is
          for i in $(seq 1 30); do rad node status >/dev/null 2>&1 && break; sleep 2; done
          rad node status || { echo "::error::radicle node did not come up"; exit 1; }

          # Bind this checkout to the published RID and push. `rad clone` is not used: the working copy
          # is already here, and the RID is fixed, so the remote is set directly.
          # The URL must be rad://<RID>/<NID>, not rad:<RID>. Git parses the latter as scp-style
          # host:path and tries to ssh to a host called "rad"; git-remote-rad is only used for a
          # scheme:// URL. Without the node ID the push is rejected: "no public key given as a
          # remote namespace". Both were found the hard way on 5 Aug 2026.
          NID="$(rad self --nid)"
          git remote add rad "rad://${RID#rad:}/$NID" 2>/dev/null || git remote set-url rad "rad://${RID#rad:}/$NID"
          git push rad "HEAD:refs/heads/main"
          rad sync status

          echo "== mirrored $(git rev-parse --short HEAD) to $RID =="
          rad seed 2>/dev/null | head -20 || true
          echo "::notice title=Radicle mirrored::$RID now carries $(git rev-parse --short HEAD). Public availability still depends on a seed replicating it; this job announces, it cannot compel anyone to hold a copy."


  # 3) IPFS — pin the signed reproduction bundle so it is addressable by content hash, host-independent.
  #    Enable by adding an IPFS_TOKEN secret; runs only when a release is published.
  ipfs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Pin the signed release bundle to IPFS via Pinata (if configured)
        env:
          IPFS_TOKEN: ${{ secrets.IPFS_TOKEN }}   # a Pinata JWT; see docs/PRESERVATION.md
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$IPFS_TOKEN" ]; then
            echo "::warning title=IPFS pin not configured::IPFS_TOKEN is not set, so NOTHING was pinned for this release. This job is green because skipping is not an error - the same failure mode the Radicle step warns about. docs/PRESERVATION.md must not claim every release is pinned while this secret is absent."
            echo "IPFS_TOKEN not set - IPFS pin skipped. See docs/PRESERVATION.md to enable."
            exit 0
          fi
          # every OBL release is a pre-release, so `gh release view` (latest, non-prerelease) finds nothing;
          # use `gh release list`, which includes pre-releases, and take the most recent tag.
          if [ -z "$TAG" ]; then TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName'); fi
          if [ -z "$TAG" ]; then echo "no release found to pin"; exit 1; fi
          echo "Pinning signed assets from release $TAG"
          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p '*.tar.gz' -p 'SHA256SUMS' -p '*.asc' || true
          shopt -s nullglob
          # A release created empty and populated afterwards fires `release: published` BEFORE its
          # assets exist, so this downloads nothing and the loop below runs zero times -- green, and
          # nothing pinned. That is exactly what happened to v0.6.0-experimental. Fail loudly instead:
          # a preservation job that preserves nothing must not report success.
          count=$(ls -1 dist/ 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error title=IPFS pin found no assets::Release $TAG has no downloadable assets, so NOTHING was pinned. Create releases WITH their assets attached (gh release create ... file1 file2), or re-run this workflow via workflow_dispatch once the assets are uploaded."
            exit 1
          fi
          echo "found $count asset(s) to pin"
          for f in dist/*; do
            echo "== pinning $(basename "$f") =="
            resp=$(curl -sS -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
              -H "Authorization: Bearer $IPFS_TOKEN" \
              -F "file=@$f" \
              -F "pinataMetadata={\"name\":\"$(basename "$f")\"}")
            cid=$(printf '%s' "$resp" | grep -o '"IpfsHash":"[^"]*"' | cut -d'"' -f4)
            echo "  CID: ${cid:-<none - check response>}   ${resp:0:200}"
          done
          echo "Every pinned file is content-addressed by CID and also SHA256-listed in SHA256SUMS, so a"
          echo "gateway copy either matches or does not. Retrieve with: ipfs get <CID>  (or any IPFS gateway)."
