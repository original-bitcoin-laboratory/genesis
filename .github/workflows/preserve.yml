# Decentralized preservation — request archival of the Original Bitcoin Laboratory repositories on
# independent, content-addressed infrastructure, so the reproducible source of truth survives even if the
# primary host does not. The reconstruction re-derives from source with no live node; this keeps that
# source retrievable and self-verifying from more than one root. NOT money.
name: preserve

on:
  schedule:
    - cron: '17 4 * * *'          # daily. Software Heritage "save now" is rate-limited, so not hourly.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) Software Heritage — the universal source-code archive. No credentials needed; runs on every trigger.
  software-heritage:
    runs-on: ubuntu-latest
    steps:
      - name: Request archival of every OBL repository
        run: |
          for repo in genesis pre-genesis common .github; do
            url="https://github.com/original-bitcoin-laboratory/$repo"
            echo "== $url =="
            resp=$(curl -sS -X POST -H "Accept: application/json" \
              "https://archive.softwareheritage.org/api/1/origin/save/git/url/$url/" || echo '{"error":"request failed"}')
            echo "  ${resp:0:300}"
            sleep 6
          done

  # 2) Radicle — a peer-to-peer git mirror, so the repo has no single hosting dependency.
  #    Enable by adding a RAD_KEYPAIR secret (one-time setup in docs/PRESERVATION.md).
  #    For hourly mirroring once configured, add:  - cron: '0 * * * *'  above.
  radicle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Mirror to Radicle (if configured)
        env:
          RAD_KEYPAIR: ${{ secrets.RAD_KEYPAIR }}
        run: |
          if [ -z "$RAD_KEYPAIR" ]; then
            echo "RAD_KEYPAIR not set — Radicle mirror skipped. See docs/PRESERVATION.md to enable."
            exit 0
          fi
          echo "RAD_KEYPAIR present — mirroring to the OBL Radicle identity."
          # One-time setup (docs/PRESERVATION.md): rad auth with the imported key, then `rad init`/`rad id`
          # bind this repo to the OBL Radicle Identifier (rid), and this step runs `rad sync --announce`.

  # 3) IPFS — pin the signed reproduction bundle so it is addressable by content hash, host-independent.
  #    Enable by adding an IPFS_TOKEN secret; runs only when a release is published.
  ipfs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' }}
    steps:
      - name: Pin the signed release bundle to IPFS via Pinata (if configured)
        env:
          IPFS_TOKEN: ${{ secrets.IPFS_TOKEN }}   # a Pinata JWT; see docs/PRESERVATION.md
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$IPFS_TOKEN" ]; then
            echo "IPFS_TOKEN not set — IPFS pin skipped. See docs/PRESERVATION.md to enable."
            exit 0
          fi
          mkdir -p dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dist -p '*.tar.gz' -p 'SHA256SUMS' -p '*.asc' || true
          shopt -s nullglob
          for f in dist/*; do
            echo "== pinning $(basename "$f") =="
            resp=$(curl -sS -X POST "https://api.pinata.cloud/pinning/pinFileToIPFS" \
              -H "Authorization: Bearer $IPFS_TOKEN" \
              -F "file=@$f" \
              -F "pinataMetadata={\"name\":\"$(basename "$f")\"}")
            cid=$(printf '%s' "$resp" | grep -o '"IpfsHash":"[^"]*"' | cut -d'"' -f4)
            echo "  CID: ${cid:-<none - check response>}   ${resp:0:200}"
          done
          echo "Every pinned file is content-addressed by CID and also SHA256-listed in SHA256SUMS, so a"
          echo "gateway copy either matches or does not. Retrieve with: ipfs get <CID>  (or any IPFS gateway)."
