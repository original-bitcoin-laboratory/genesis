[package]
name = "obl-validator"
version = "0.1.0"
edition = "2021"
description = "A dependency-free Rust port of the X-chain context-free block validator. NOT money."
license = "MIT"
authors = ["parthod0x"]

[lib]
name = "obl_validator"
path = "src/lib.rs"
# rlib for the native bin + `cargo test`; cdylib for the wasm32 build that backs the browser verifier.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "obl-validate"
path = "src/main.rs"

# The context-free validator is dependency-free (SHA-256 is in-crate). The *stateful* layer + the
# script interpreter use pure-Rust RustCrypto crates (no C compiler / OpenSSL needed):
#   k256 — secp256k1 ECDSA; num-bigint — v0.1's unbounded sign-magnitude script arithmetic;
#   ripemd / sha1 — the RIPEMD-160 / SHA-1 hash opcodes.
[dependencies]
k256 = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
ripemd = "0.1"
sha1 = "0.10"

# wasm32 only (the browser verifier). `serde_json` builds the result objects. `getrandom` is pulled
# transitively by k256; the verifier never signs (signing is deterministic RFC6979 and unused here), so
# we register a stub via the `custom` feature rather than `js` — that keeps the wasm import-free (no
# wasm-bindgen), so it instantiates from inlined bytes. None of this reaches native builds.
[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1"
getrandom = { version = "0.2", features = ["custom"] }
