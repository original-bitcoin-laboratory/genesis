[package]
name = "obl-validator"
version = "0.1.0"
edition = "2021"
description = "A dependency-free Rust port of the X-chain context-free block validator. NOT money."
license = "MIT"
authors = ["parthod0x"]

[lib]
name = "obl_validator"
path = "src/lib.rs"

[[bin]]
name = "obl-validate"
path = "src/main.rs"

# The context-free validator is dependency-free (SHA-256 is in-crate). The *stateful* layer needs
# ECDSA, so it uses k256 — the pure-Rust RustCrypto secp256k1 (no C compiler / OpenSSL needed).
[dependencies]
k256 = "0.13"
