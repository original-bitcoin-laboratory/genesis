[package]
name = "obl-validator"
version = "0.1.0"
edition = "2021"
description = "A dependency-free Rust port of the X-chain context-free block validator. NOT money."
license = "MIT"
authors = ["parthod0x"]

[lib]
name = "obl_validator"
path = "src/lib.rs"

[[bin]]
name = "obl-validate"
path = "src/main.rs"

# Deliberately zero dependencies: SHA-256 is implemented in-crate so `cargo test` verifies the
# whole validator offline, against golden vectors generated by the (verified) Python node.
[dependencies]
